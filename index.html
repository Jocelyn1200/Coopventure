<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coop Venture — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --welcome-purple: #6d28d9;
      --welcome-purple-mid: #7c3aed;
      --header-purple: #57068c;
      --btn-top: #a78bfa;
      --btn-mid: #8b5cf6;
      --btn-bottom: #5b21b6;
      --btn-shadow: rgba(91, 33, 182, 0.38);
      --spark: #e879f9;
      --spark-hot: #d946ef;
      --nyu-violet: #57068c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--header-purple);
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 100% 88% at 50% 38%, #fdfcff 0%, #f7f2ff 42%, #efe6fb 72%, #e8def7 100%);
      overflow-x: hidden;
      opacity: 0;
      animation: pageIn 0.85s ease forwards;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.42;
      background-image:
        radial-gradient(rgba(91, 33, 182, 0.12) 0.8px, transparent 1.05px),
        radial-gradient(rgba(124, 58, 237, 0.09) 0.65px, transparent 0.95px),
        radial-gradient(rgba(109, 40, 217, 0.07) 1px, transparent 1.15px);
      background-size: 40px 44px, 58px 52px, 26px 32px;
      background-position: 0 0, 16px 24px, 9px 5px;
    }

    @keyframes pageIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(1rem, 3vw, 1.75rem) clamp(1.25rem, 5vw, 2.5rem) clamp(2rem, 6vw, 3rem);
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      opacity: 0;
      animation: fadeUp 0.85s ease 0.12s forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nyu-logo {
      width: clamp(30px, 7vw, 38px);
      height: auto;
      flex-shrink: 0;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(87, 6, 140, 0.2));
    }

    .brand-name {
      font-size: clamp(0.82rem, 2.2vw, 0.98rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--header-purple);
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(1.35rem, 3.8vw, 2rem);
      padding-block: clamp(1rem, 4vh, 2rem);
    }

    .hero-wrap {
      display: inline-block;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.28s forwards;
    }

    .welcome {
      position: relative;
      display: inline-block;
      margin: 0;
      font-size: clamp(2.85rem, 10.5vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.02;
      color: var(--welcome-purple);
    }

    .welcome-subtitle {
      margin: 0.6rem 0 0;
      font-size: clamp(0.95rem, 2.7vw, 1.2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--body-gray);
    }

    .sparkle {
      position: absolute;
      right: -0.06em;
      top: -0.02em;
      width: clamp(20px, 5vw, 30px);
      height: clamp(20px, 5vw, 30px);
      transform: translate(58%, -48%);
      pointer-events: none;
    }

    .sparkle svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 6px rgba(217, 70, 239, 0.45));
    }

    .cta-wrap {
      opacity: 0;
      animation: fadeUp 0.9s ease 0.45s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.5rem;
      font-family: inherit;
      font-size: clamp(0.98rem, 2.4vw, 1.08rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--btn-top) 0%, var(--btn-mid) 38%, var(--welcome-purple) 72%, var(--btn-bottom) 100%);
      box-shadow:
        0 16px 36px var(--btn-shadow),
        0 6px 14px rgba(91, 33, 182, 0.22),
        0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    .cta:hover {
      transform: scale(1.04) translateY(-1px);
      filter: brightness(1.05);
      box-shadow:
        0 20px 44px rgba(91, 33, 182, 0.42),
        0 8px 18px rgba(91, 33, 182, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
    }

    .cta:focus-visible {
      outline: 2px solid var(--welcome-purple-mid);
      outline-offset: 4px;
    }

    .cta:active {
      transform: scale(1.02);
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .top-bar,
      .hero-wrap,
      .cta-wrap {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      .cta:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <svg class="nyu-logo" viewBox="0 0 44 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NYU">
        <title>NYU</title>
        <rect width="44" height="36" rx="9" fill="var(--nyu-violet)"/>
        <text
          x="50%"
          y="50%"
          dominant-baseline="central"
          text-anchor="middle"
          fill="#fff"
          font-family="Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="0.04em"
        >NYU</text>
      </svg>
      <span class="brand-name">Coop Venture</span>
    </header>

    <main class="main">
      <div class="hero-wrap">
        <h1 class="welcome">
          Welcome
          <span class="sparkle" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="26" cy="7" r="1.35" fill="var(--spark)"/>
              <circle cx="28.5" cy="9.5" r="1" fill="var(--spark-hot)"/>
              <path
                d="M16 2.5l2.2 7.1 7.1 2.2-7.1 2.2L16 21.2l-2.2-7.2-7.1-2.2 7.1-2.2L16 2.5z"
                fill="var(--spark-hot)"
              />
            </svg>
          </span>
        </h1>
        <p class="welcome-subtitle">Industry-ready, before you apply</p>
      </div>
      <div class="cta-wrap">
        <a class="cta" href="landing-page.html">Start Here</a>
      </div>
    </main>
  </div>
</body>
</html>
