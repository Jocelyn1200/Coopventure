<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coop Venture — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-violet: #e9e2f4;
      --welcome-purple: #5b21b6;
      --welcome-purple-deep: #4c1d95;
      --text-muted: rgba(60, 40, 100, 0.62);
      --btn: #5b21b6;
      --btn-hover: #4c1d95;
      --btn-shadow: rgba(91, 33, 182, 0.28);
      --nyu-violet: #57068c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--welcome-purple-deep);
      background: var(--page-violet);
      overflow-x: hidden;
      opacity: 0;
      animation: pageIn 1s ease forwards;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(1rem, 3vw, 1.75rem) clamp(1.25rem, 5vw, 2.5rem) clamp(2rem, 6vw, 3rem);
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.15s forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nyu-logo {
      width: clamp(28px, 7vw, 36px);
      height: auto;
      flex-shrink: 0;
      display: block;
    }

    .brand-name {
      font-size: clamp(0.8rem, 2.2vw, 0.95rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-muted);
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(1.5rem, 4vw, 2.25rem);
      padding-block: clamp(1rem, 4vh, 2rem);
    }

    .hero-wrap {
      display: inline-block;
      opacity: 0;
      animation: fadeUp 1s ease 0.35s forwards;
    }

    .welcome {
      margin: 0;
      font-size: clamp(2.75rem, 10vw, 4.75rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--welcome-purple);
    }

    .cta-wrap {
      opacity: 0;
      animation: fadeUp 1s ease 0.55s forwards;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.95rem 2.25rem;
      font-family: inherit;
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
      text-decoration: none;
      background: var(--btn);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow:
        0 4px 20px var(--btn-shadow),
        0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      transition:
        transform 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease;
    }

    .cta:hover {
      background: var(--btn-hover);
      transform: scale(1.035);
      box-shadow:
        0 8px 28px rgba(45, 27, 78, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    }

    .cta:focus-visible {
      outline: 2px solid var(--welcome-purple);
      outline-offset: 4px;
    }

    .cta:active {
      transform: scale(1.02);
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .top-bar,
      .hero-wrap,
      .cta-wrap {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <svg class="nyu-logo" viewBox="0 0 44 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NYU">
        <title>NYU</title>
        <rect width="44" height="36" rx="7" fill="var(--nyu-violet)"/>
        <text
          x="50%"
          y="50%"
          dominant-baseline="central"
          text-anchor="middle"
          fill="#fff"
          font-family="Inter, system-ui, sans-serif"
          font-size="13"
          font-weight="700"
          letter-spacing="0.04em"
        >NYU</text>
      </svg>
      <span class="brand-name">Coop Venture</span>
    </header>

    <main class="main">
      <div class="hero-wrap">
        <h1 class="welcome">Welcome</h1>
      </div>
      <div class="cta-wrap">
        <a class="cta" href="https://coopventure.vercel.app/">Start Here</a>
      </div>
    </main>
  </div>
</body>
</html>
